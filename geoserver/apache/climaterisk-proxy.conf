# XAMPP Apache reverse proxy for the Bengaluru Climate Risk Scanner
#
# The web app lives in C:\xampp\htdocs\climaterisk and is opened at http://localhost/climaterisk/
# This proxy makes GeoServer reachable at http://localhost/geoserver too, so the pages and the
# OGC services share one address and the browser never hits cross-origin (CORS) errors.
#
# 1. In C:\xampp\apache\conf\httpd.conf make sure these two lines are NOT commented (no leading #):
#      LoadModule proxy_module modules/mod_proxy.so
#      LoadModule proxy_http_module modules/mod_proxy_http.so
# 2. Copy this file to C:\xampp\apache\conf\extra\climaterisk-proxy.conf
# 3. Add this line at the end of httpd.conf:
#      Include conf/extra/climaterisk-proxy.conf
# 4. Restart Apache from the XAMPP Control Panel.
#
# Keep XAMPP's Tomcat switched OFF: it also uses port 8080, which GeoServer needs.

ProxyRequests Off
ProxyPreserveHost On

# GeoServer (Jetty, port 8080)
ProxyPass        /geoserver http://localhost:8080/geoserver
ProxyPassReverse /geoserver http://localhost:8080/geoserver
